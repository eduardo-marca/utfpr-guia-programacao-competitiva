site_name: Guia de Programação Competitiva UTFPR
site_description: Guia para estudo e treinamento em Programação Competitiva da UTFPR.

site_url: https://eduardo-marca.github.io/utfpr-guia-programacao-competitiva/

repo_url: https://github.com/eduardo-marca/utfpr-guia-programacao-competitiva
repo_name: utfpr-guia-programacao-competitiva

edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  language: pt-BR
  features:
    - navigation.sections
    - navigation.expand
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - content.code.copy
  icon:
    repo: fontawesome/brands/git-alt

  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7 
        name: Trocar para modo escuro

    # Palette toggle for dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Trocar para modo claro

extra:
  generator: false

markdown_extensions:
  - admonition
  - tables
  
  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.inlinehilite

  - pymdownx.arithmatex:
      generic: true

  - markdown_katex:
      no_inline_svg: false # Keeps math as vectors for clean printing

plugins:
  - macros
  - search
  - mermaid2
  - print-site:
      add_to_navigation: false
      toc_title: 'Sumário'
      enumerate_headings: false
      add_cover_page: true
      cover_page_template: "docs/assets/templates/custom_cover_page.tpl"
      exclude:
        - index.md
        - introduction/learning-path.md
        - contribute/*

hooks:
  - scripts/pdf_markers.py
  - scripts/topic_overview.py

extra_css:
  - stylesheets/style.css
  - stylesheets/pdf.css

extra_javascript:
  - javascripts/script.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Início:
      - Página inicial: index.md
      - O que é Programação Competitiva: introduction/what-is-cp.md
      - Trilha de Aprendizagem: introduction/learning-path.md

  - C++:
      - Básico de C++: algorithms/cpp/basics.md
      - STL: algorithms/cpp/stl.md

  - Técnicas e Paradigmas:
      - Busca Completa: algorithms/paradigms/complete-search.md
      - Busca Binária:
          - Introdução: algorithms/basic-algorithms/binary-search.md
          - Busca Binária na Resposta: algorithms/basic-algorithms/binary-search-on-answer.md
      - Dois Ponteiros e Janela Deslizante: algorithms/basic-algorithms/two-pointers-sliding-window.md
      - Algoritmos Gulosos: algorithms/paradigms/greedy.md
      - Programação Dinâmica: algorithms/paradigms/dynamic-programming.md

  - Estruturas de Dados:
      - Disjoint Set Union (DSU): algorithms/data-structures/disjoint-set-union.md
      - Fenwick Tree: algorithms/data-structures/fenwick.md
      - Árvore de Segmentos: algorithms/data-structures/segtree.md
      - Lazy Propagation: algorithms/data-structures/lazy.md

  - Grafos:
      - Conceitos Básicos: algorithms/graphs/graph-basics.md
      - Outros Conceitos: algorithms/graphs/other-concepts.md
      - Percursos:
          - Busca em Profundidade (DFS): algorithms/graphs/traversal/dfs.md
          - Busca em Largura (BFS): algorithms/graphs/traversal/bfs.md
      - Menores Caminhos:
          - Dijkstra: algorithms/graphs/shortest-path/dijkstra.md
          - Bellman-Ford: algorithms/graphs/shortest-path/bellman-ford.md
      - Grafos Direcionados:
          - Ordenação Topológica: algorithms/graphs/directed-graphs/topological-sorting.md

  - Strings:
      - KMP: algorithms/string/kmp.md

  - Matemática:
      - Teoria dos Números e Álgebra:
          - Teoria dos Números: algorithms/math/algebra/number-theory-basics.md
          - Aritmética Modular: algorithms/math/algebra/modular-arithmetic.md
      - Combinatória: algorithms/math/combinatorics/combinatorics-basics.md
      - Geometria: algorithms/math/geometry/geometry-basics.md
      - Teoria dos Jogos:
          - Introdução: algorithms/math/game-theory/game-theory-basics.md
          - Teorema de Sprague-Grundy: algorithms/math/game-theory/sprague-grundy-theorem.md
          - Jogo de Misère: algorithms/math/game-theory/misere-games.md

  - Como Contribuir:
      - Visão geral: contribute/index.md
      - Instalação: contribute/installation.md
      - GitHub: contribute/github.md
      - MkDocs e Material: contribute/mkdocs.md
      - Referência em PDF: contribute/pdf.md
