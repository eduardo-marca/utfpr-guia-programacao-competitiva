site_name: Guia de Programação Competitiva UTFPR
site_description: Guia para estudo e treinamento em Programação Competitiva da UTFPR.

site_url: https://eduardo-marca.github.io/utfpr-guia-programacao-competitiva/

repo_url: https://github.com/eduardo-marca/utfpr-guia-programacao-competitiva
repo_name: utfpr-guia-programacao-competitiva

edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  language: pt-BR
  features:
    - navigation.sections
    - navigation.expand
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - content.code.copy
  icon:
    repo: fontawesome/brands/git-alt

  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7 
        name: Trocar para modo escuro

    # Palette toggle for dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Trocar para modo claro

extra:
  generator: false

markdown_extensions:
  - admonition
  - tables
  
  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.inlinehilite

  - pymdownx.arithmatex:
      generic: true

  - markdown_katex:
      no_inline_svg: false # Keeps math as vectors for clean printing

plugins:
  - macros
  - search
  - mermaid2
  - print-site:
      add_to_navigation: false
      toc_title: 'Sumário'
      enumerate_headings: false
      add_cover_page: true
      cover_page_template: "docs/assets/templates/custom_cover_page.tpl"
      exclude:
        - index.md
        - pratica/roteiros/learning-path.md
        - contribuir/*

hooks:
  - scripts/pdf_markers.py
  - scripts/topic_overview.py

extra_css:
  - stylesheets/style.css
  - stylesheets/pdf.css

extra_javascript:
  - javascripts/script.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Início: index.md
  - Começar:
      - O que é programação competitiva: comecar/what-is-cp.md
  - Fundamentos:
      - C++: fundamentos/cpp.md
      - STL: fundamentos/stl.md
  - Técnicas e Estruturas:
      - Técnicas:
          - Prefix Sum: tecnicas-estruturas/tecnicas/prefix-sum.md
          - Two Pointers e Sliding Window: tecnicas-estruturas/tecnicas/two-pointers-sliding-window.md
          - Busca Binária: tecnicas-estruturas/tecnicas/busca-binaria.md
          - Busca Binária na Resposta: tecnicas-estruturas/tecnicas/binary-search-on-answer.md
          - Busca Completa: tecnicas-estruturas/tecnicas/complete-search.md
          - Compressão de Coordenadas: tecnicas-estruturas/tecnicas/compressao-de-coordenadas.md
          - Algoritmos Gulosos: tecnicas-estruturas/tecnicas/greedy.md
      - Estruturas de Dados:
          - DSU: tecnicas-estruturas/estruturas/disjoint-set-union.md
          - Fenwick Tree: tecnicas-estruturas/estruturas/fenwick.md
          - Árvore de Segmentos: tecnicas-estruturas/estruturas/segtree.md
