site_name: Guia de Programação Competitiva UTFPR
site_description: Guia para estudo e treinamento em Programação Competitiva da UTFPR.

site_url: https://eduardo-marca.github.io/utfpr-guia-programacao-competitiva/

repo_url: https://github.com/eduardo-marca/utfpr-guia-programacao-competitiva
repo_name: utfpr-guia-programacao-competitiva

edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  language: pt-BR
  features:
    - navigation.sections
    - navigation.expand
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - content.code.copy
  icon:
    repo: fontawesome/brands/git-alt

  palette: 
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Trocar para modo escuro

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Trocar para modo claro

extra:
  generator: false

markdown_extensions:
  - admonition
  - tables
  
  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.inlinehilite

  - pymdownx.arithmatex:
      generic: true

  - markdown_katex:
      no_inline_svg: false # Keeps math as vectors for clean printing

plugins:
  - search
  - mermaid2
  - to-pdf:
      output_path: "pdf/guia-de-programação-competitiva-utfpr.pdf"
      cover_title: Guia de Programação Competitiva UTFPR
      cover_subtitle: Guia para estudo e treinamento em Programação Competitiva da UTFPR.
      cover_logo: assets/logo.svg
      toc_title: "Sumário"
      toc_level: 2
      enabled_if_env: ENABLE_PDF_EXPORT
      exclude_pages:
        - 'introduction/'

  - print-site:
      add_to_navigation: false
      toc_title: 'Sumário'
      enumerate_headings: false
      add_cover_page: true
      cover_page_template: "docs/assets/templates/custom_cover_page.tpl"
      exclude:
        - index.md
        - introduction/learning-path.md
        - contribute/*

  # opção alternativa para gerar PDF com o plugin `with-pdf`
  #- with-pdf:
  #    output_path: "pdf/guia-de-programacao-competitiva-withpdf.pdf"

extra_css:
  - stylesheets/style.css

extra_javascript:
  - javascripts/script.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

